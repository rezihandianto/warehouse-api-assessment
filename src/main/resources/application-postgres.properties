# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:warehouse}
spring.datasource.username=${DB_USER:warehouse}
spring.datasource.password=${DB_PASSWORD:warehouse}
spring.jpa.hibernate.ddl-auto=update
